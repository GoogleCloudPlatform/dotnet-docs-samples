# Format: //devtools/kokoro/config/proto/build.proto

# Download secrets from Cloud Storage.
gfile_resources: "/bigstore/cloud-devrel-kokoro-resources/dotnet-docs-samples"

# All builds use the trampoline script to run in docker.
build_file: "dotnet-docs-samples/.kokoro-windows/trampoline3.bat"

# Bump timeout for tests from 3 hours (default) to 5 hours to allow Spanner tests time to complete
timeout_mins: 300